<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0C" />
  <title>Offline · Shaan Fitness</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #0A0A0C; color: #F5F5F7;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Telugu", sans-serif; }
    main { max-width: 360px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: #A8A8B3; line-height: 1.5; }
    button { min-height: 48px; border: 0; border-radius: 14px; background: #E01020; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="Shaan Fitness" />
    <h1>You’re offline</h1>
    <p>Check your internet connection, then try again.</p>
    <p lang="te">ఇంటర్నెట్ కనెక్షన్ లేదు. కనెక్షన్ చూసి మళ్ళీ ప్రయత్నించండి.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
